name: Pipeline Deploy EC2

on:
  push:
    branches:
      - develop
      - main

env:
  IMAGE_NAME: miguelsantana08/minha-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy-homologacao:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Automático em Homologação
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            # Limpa qualquer container anterior ou conflito na porta 8080
            docker stop api-homol api-prod 2>/dev/null || true
            docker rm api-homol api-prod 2>/dev/null || true
            docker stop $(docker ps -q --filter "publish=8080") 2>/dev/null || true
            docker container prune -f || true
            # Sobe o container de homologação
            docker run -d --name api-homol -p 8080:8080 ${{ env.IMAGE_NAME }}:latest

  deploy-producao:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: producao
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Controlado em Produção
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            # Limpa qualquer container anterior ou conflito na porta 8080
            docker stop api-homol api-prod 2>/dev/null || true
            docker rm api-homol api-prod 2>/dev/null || true
            docker stop $(docker ps -q --filter "publish=8080") 2>/dev/null || true
            docker container prune -f || true
            # Sobe o container de produção
            docker run -d --name api-prod -p 8080:8080 ${{ env.IMAGE_NAME }}:latest
